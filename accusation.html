<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Make Your Accusation | Forgotten Files</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">


    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<nav class="navbar fixed-top">

    <div class="container-fluid px-5">

        <a
            class="navbar-brand"
            href="index.html">

            ✦ FORGOTTEN

            <small>FILES</small>

        </a>


        <a
            href="case-001.html"
            class="nav-button">

            ← CASE

        </a>

    </div>

</nav>



<section
    style="
    min-height:100vh;
    padding-top:170px;
    padding-bottom:100px;
    background:#0d0d0c;
    ">

    <div class="container">

        <div
            style="
            max-width:700px;
            margin:auto;
            ">

            <p class="section-label">
                CASE #001 • FINAL DECISION
            </p>


            <h1
                style="
                font-family:'Cormorant Garamond';
                font-size:80px;
                font-weight:400;
                line-height:.8;
                ">

                MAKE YOUR
                <i>ACCUSATION.</i>

            </h1>


            <p
                style="
                color:#777;
                line-height:1.8;
                margin:35px 0;
                ">

                You have examined the evidence.
                You have studied the suspects.

                Now identify the person you believe
                is responsible.

            </p>



            <form
                id="accusationForm"
                onsubmit="return submitAccusation(event)"
                style="
                background:#171715;
                border:1px solid #292824;
                padding:40px;
                ">


                <label
                    for="suspect"
                    style="
                    color:#999;
                    font-size:10px;
                    letter-spacing:2px;
                    ">

                    SELECT SUSPECT

                </label>


                <select
                    id="suspect"
                    class="form-select"
                    style="
                    margin-top:12px;
                    margin-bottom:30px;
                    background:#0d0d0c;
                    color:#ddd;
                    border:1px solid #3a3833;
                    ">

                    <option value="">
                        Select a suspect
                    </option>

                    <option value="Victoria Ashford">
                        Victoria Ashford
                    </option>

                    <option value="Daniel Moore">
                        Daniel Moore
                    </option>

                    <option value="Michael Reed">
                        Michael Reed
                    </option>

                    <option value="Sophia Blake">
                        Sophia Blake
                    </option>

                    <option value="Thomas Green">
                        Thomas Green
                    </option>

                    <option value="Lucas Ashford">
                        Lucas Ashford
                    </option>

                </select>



                <label
                    for="reason"
                    style="
                    color:#999;
                    font-size:10px;
                    letter-spacing:2px;
                    ">

                    YOUR REASONING

                </label>


                <textarea
                    id="reason"
                    rows="6"
                    placeholder="Explain the evidence that led you to your conclusion..."
                    style="
                    width:100%;
                    margin-top:12px;
                    margin-bottom:30px;
                    padding:15px;
                    background:#0d0d0c;
                    color:#ddd;
                    border:1px solid #3a3833;
                    resize:none;
                    "></textarea>


                <button
                    type="submit"
                    class="primary-btn"
                    style="border:none;">

                    SUBMIT ACCUSATION →

                </button>


                <p
                    id="result"
                    style="
                    margin-top:25px;
                    color:#a79d8b;
                    "></p>


            </form>

        </div>

    </div>

</section>



<script>

function submitAccusation(event) {

    event.preventDefault();


    let suspect =
        document.getElementById(
            "suspect"
        ).value;


    let reason =
        document.getElementById(
            "reason"
        ).value.trim();


    let result =
        document.getElementById(
            "result"
        );


    if (suspect === "") {

        result.innerHTML =
            "⚠ Please select a suspect.";

        return false;

    }


    if (reason === "") {

        result.innerHTML =
            "⚠ Please provide your reasoning.";

        return false;

    }


    result.innerHTML =
        "✓ Your accusation has been recorded. The case file is being reviewed.";


    return false;

}

</script>


</body>

</html>
